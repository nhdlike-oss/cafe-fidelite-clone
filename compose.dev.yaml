# Mode DÉVELOPPEMENT (confort : rechargement automatique, DEBUG=True). Ce n'est PAS la production.
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  web:
    environment:
      DEBUG: "True"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
