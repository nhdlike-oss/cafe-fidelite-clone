# Proxy inverse : SEUL conteneur exposé (localhost:8000). L'application et la base
# restent sur le réseau interne de Docker.
upstream application {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 2m;

    # Fichiers statiques (CSS de l'application et de l'administration) : servis directement
    # par nginx depuis le volume rempli par `collectstatic` (ADR-0014).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://application;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
